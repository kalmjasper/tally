syntax = "proto3";

package finance;

service CategoryService {
  // A flat list; build the tree from parent_id.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  // A child category must have the same kind as its parent.
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  // Renames and/or moves a category. An absent parent_id makes it top-level.
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  // Set two independent tags on an expense category.
  rpc SetCategoryTags(SetCategoryTagsRequest) returns (SetCategoryTagsResponse);
  // Refused while the category has subcategories or splits.
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
}

enum CategoryKind {
  CATEGORY_KIND_UNSPECIFIED = 0;
  CATEGORY_KIND_EXPENSE = 1;
  CATEGORY_KIND_INCOME = 2;
}

message Category {
  int64 id = 1;
  optional int64 parent_id = 2;
  string name = 3;
  CategoryKind kind = 4;
  bool fixed = 5;
  bool yearly_cost = 6;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateCategoryRequest {
  optional int64 parent_id = 1;
  string name = 2;
  CategoryKind kind = 3;
  bool fixed = 4;
  bool yearly_cost = 5;
}

message CreateCategoryResponse {
  Category category = 1;
}

message UpdateCategoryRequest {
  int64 id = 1;
  string name = 2;
  optional int64 parent_id = 3;
}

message UpdateCategoryResponse {
  Category category = 1;
}

message SetCategoryTagsRequest {
  int64 id = 1;
  bool fixed = 2;
  bool yearly_cost = 3;
}

message SetCategoryTagsResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  int64 id = 1;
}

message DeleteCategoryResponse {}
